<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GFS Scanner</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6ea;--up:#0a8f55;--dn:#d0342c;--ac:#2563eb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#8b94a3;--bd:#262c36;--up:#35c48a;--dn:#ff6b61;--ac:#6ea0ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px;color:var(--mut)}
.top,.row,.btns{display:flex;justify-content:space-between;align-items:center;gap:8px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer}.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.meta{color:var(--mut);font-size:13px;margin:6px 0 12px}
.warn{background:#fff3cd;color:#664d03;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input{flex:1;min-width:90px}.tools #risk{width:90px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sym{font-weight:700;font-size:17px;color:var(--ac);text-decoration:none}
.px{color:var(--mut);font-size:13px}
.rsi{display:flex;gap:6px;margin:8px 0}
.rsi span{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:4px 0;font-size:12px;color:var(--mut)}
.rsi b{display:block;font-size:15px;color:var(--tx)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.lv div{font-size:12px;color:var(--mut)}.lv b{display:block;font-size:16px}
.e b{color:var(--ac)}.s b,.neg{color:var(--dn)}.t b,.pos{color:var(--up)}
.qty{background:var(--bg);border-radius:10px;padding:8px;margin-top:8px;text-align:center;font-size:13px}.qty b{font-size:15px}
.btns{margin-top:10px}.btns button{flex:1}
.badge{margin-top:8px;text-align:center;font-size:13px;padding:6px;border-radius:8px;background:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mut)}.grid b{display:block;font-size:16px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;text-align:right;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
.ov{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center;z-index:9}
.box{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}.box input,.box select,.box textarea{width:100%}
.note{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>GFS Scanner</h1><button id="rf">↻ Refresh</button></div>
  <div class="tabs"><button id="t1" class="on">Scan</button><button id="t2">Journal</button></div>
  <div id="v1">
    <div class="meta" id="meta">Loading…</div><div id="warn"></div>
    <div class="tools">
      <input id="risk" type="number" min="1" title="Risk per trade (₹)">
      <input id="q" placeholder="Search symbol" autocapitalize="characters">
      <select id="sort"><option value="Risk%">Lowest risk %</option><option value="DailyRSI">Daily RSI</option><option value="MonthlyRSI">Monthly RSI</option><option value="Symbol">A–Z</option></select>
    </div>
    <div id="list"></div>
  </div>
  <div id="v2" style="display:none"></div>
</div>
<div id="sh" class="ov"></div>
<script>
const $=id=>document.getElementById(id);
const LS="gfs_journal_v1",LR="gfs_risk";
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert("Couldn’t save: browser storage is blocked.")}};
let J=ld(LS,[]),RISK=ld(LR,500),data=null,S=[],JL=[];
const MIND=["Calm & disciplined","Confident","Hopeful","Anxious / fearful","Impatient","Greedy","FOMO"];
const fmt=n=>Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const rs=n=>(n<0?"-":"")+"₹"+fmt(Math.abs(n));
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const sid=x=>x.Symbol+"|"+x.SignalDate;
const cls=n=>n>=0?"pos":"neg";
const bad=m=>{alert(m);return false};
let SC=ld("gfs_sync",null),SS=SC?"Not synced yet":"Sync is off (this device only)",busy=false,again=false;
const persist=()=>{sv(LS,J);sync()};
const setSS=t=>{SS=t;const n=$("ss");if(n)n.textContent=t};
function merge(loc,rem){const m={};[...rem,...loc].forEach(e=>{const o=m[e.id];if(!o||(e.u||0)>=(o.u||0))m[e.id]=e});return Object.values(m)}
const sUrl=()=>SC.url.replace(/\/+$/,"")+"/journal/"+encodeURIComponent(SC.key)+".json";
async function sync(){
  if(!SC)return;
  if(busy){again=true;return}
  busy=true;
  try{
    const r=await fetch(sUrl(),{cache:"no-store"});if(!r.ok)throw 0;
    const rem=await r.json(),rl=rem?(Array.isArray(rem)?rem:Object.values(rem)).filter(Boolean):[];
    J=merge(J,rl);sv(LS,J);
    const w=await fetch(sUrl(),{method:"PUT",body:JSON.stringify(J)});if(!w.ok)throw 0;
    setSS("Synced "+new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}));
    render();if($("v2").style.display!=="none")renderJ();
  }catch(e){setSS("Couldn’t sync. Saved on this device and will retry.")}
  busy=false;if(again){again=false;sync()}
}
function syncSetup(){
  sheet("Sync setup",`<div class="note">Use the same two values on every device.</div>
    <label>Firebase database URL</label><input id="f1" placeholder="https://xxxx-default-rtdb.firebaseio.com" value="${esc(SC&&SC.url)}">
    <label>Secret key (20+ letters/numbers, keep it private)</label><input id="f2" value="${esc(SC&&SC.key)}">
    ${SC?'<button onclick="syncOff()" style="margin-top:12px">Turn sync off</button>':""}`,
    ()=>{const u=val("f1").trim(),k=val("f2").trim();
      if(!/^https:\/\/\S+$/.test(u)||!/^[A-Za-z0-9]{20,}$/.test(k))return bad("Enter the https URL and a key of 20+ letters/numbers (no spaces or symbols)");
      SC={url:u,key:k};sv("gfs_sync",SC);setSS("Syncing…");sync()});
}
function syncOff(){SC=null;try{localStorage.removeItem("gfs_sync")}catch(e){}setSS("Sync is off (this device only)");closeSh();renderJ()}

function tab(n){$("v1").style.display=n==1?"":"none";$("v2").style.display=n==2?"":"none";$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";if(n==2)renderJ()}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);

async function load(){
  $("meta").textContent="Loading…";
  try{const r=await fetch("results.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;data=await r.json()}
  catch(e){data=null;$("list").innerHTML='<div class="empty">Couldn’t load results.json.<br>Run the GitHub workflow first.</div>';$("meta").textContent="No data";return}
  const g=new Date(data.generated);
  $("meta").textContent=`Scan: ${g.toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})} · ${data.count} of ${data.universe} stocks`;
  const d=(Date.now()-g)/864e5;
  $("warn").innerHTML=d>3.5?'<div class="warn">⚠ This list is '+Math.floor(d)+' days old. The daily scan may not be running.</div>':"";
  render();
}

function render(){
  if(!data)return;
  const q=$("q").value.trim().toUpperCase(),k=$("sort").value;
  S=data.stocks.filter(x=>x.Symbol.includes(q));
  S.sort((a,b)=>k==="Symbol"?a.Symbol.localeCompare(b.Symbol):k==="Risk%"?a[k]-b[k]:b[k]-a[k]);
  if(!S.length){$("list").innerHTML='<div class="empty">No stocks match the GFS conditions.</div>';return}
  $("list").innerHTML=S.map((x,i)=>{
    const tv="https://www.tradingview.com/chart/?symbol=NSE:"+encodeURIComponent(x.Symbol.replace(/[&-]/g,"_"));
    const n=Math.floor(RISK/x["Risk/Share"]),j=J.find(e=>!e.deleted&&e.id===sid(x));
    const st=j?`<div class="badge">${j.status==="taken"?"✓ Trade taken":"✗ Not taken"} · see Journal</div>`
      :`<div class="btns"><button onclick="act('take',${i})">✓ Trade taken</button><button onclick="act('skip',${i})">✗ Not taken</button></div>`;
    return `<div class="card">
      <div class="row"><a class="sym" href="${tv}" target="_blank" rel="noopener">${esc(x.Symbol)}</a><span class="px">₹${fmt(x.Close)} · ${x.SignalDate}</span></div>
      <div class="rsi"><span>Monthly<b>${x.MonthlyRSI}</b></span><span>Weekly<b>${x.WeeklyRSI}</b></span><span>Daily<b>${x.DailyRSI}</b></span></div>
      <div class="lv"><div class="e">Entry<b>${fmt(x.Entry)}</b></div><div class="s">Stop-loss<b>${fmt(x.StopLoss)}</b></div><div class="t">Target 1:3<b>${fmt(x.Target)}</b></div></div>
      <div class="qty">${n>0?`Buy <b>${n}</b> shares · Capital ${rs(n*x.Entry)} · Risk ${rs(n*x["Risk/Share"])}`:`Risk/share ${rs(x["Risk/Share"])} is above your ${rs(RISK)} limit (qty 0)`}</div>
      ${st}</div>`}).join("");
}

function sheet(title,html,ok){
  $("sh").innerHTML=`<div class="box"><h2>${title}</h2>${html}<div class="btns"><button onclick="closeSh()">Cancel</button><button class="pri" id="ok">Save</button></div></div>`;
  $("sh").style.display="flex";$("ok").onclick=()=>{if(ok()!==false)closeSh()};
}
const closeSh=()=>{$("sh").style.display="none"};
const val=id=>$(id).value;

function tr(stop){const r=((+val("f1"))-stop)*(+val("f2"));$("tr").innerHTML=`Total risk: <b>${rs(r)}</b> <span class="px">(entry − stop ${fmt(stop)}) × qty</span>`}

function act(a,i){
  const x=S[i];
  if(a==="take"){
    const n=Math.floor(RISK/x["Risk/Share"])||1;
    sheet("Trade taken · "+esc(x.Symbol),
      `<label>Entry price (₹)</label><input id="f1" type="number" step="0.05" value="${x.Entry}" oninput="tr(${x.StopLoss})">
       <label>Quantity</label><input id="f2" type="number" value="${n}" oninput="tr(${x.StopLoss})">
       <label>Date of entry</label><input id="f3" type="date" value="${today()}">
       <div class="qty" id="tr"></div>`,
      ()=>{const e=+val("f1"),q=+val("f2");if(!(e>0&&q>0&&val("f3")))return bad("Enter price, quantity and date");
        J.push({id:sid(x),symbol:x.Symbol,signalDate:x.SignalDate,status:"taken",entry:e,qty:q,entryDate:val("f3"),stop:x.StopLoss,target:x.Target,risk:(e-x.StopLoss)*q,u:Date.now()});
        persist();render()});
    tr(x.StopLoss);
  }else{
    sheet("Not taken · "+esc(x.Symbol),`<label>Reason for skipping</label><textarea id="f1" rows="4" placeholder="e.g. gap-up above entry, market weak, no funds…"></textarea>`,
      ()=>{if(!val("f1").trim())return bad("Please write a reason");
        J.push({id:sid(x),symbol:x.Symbol,signalDate:x.SignalDate,status:"skipped",reason:val("f1").trim(),entryDate:today(),u:Date.now()});persist();render()});
  }
}

function closeT(i){
  const e=JL[i];
  sheet("Exit · "+esc(e.symbol),
    `<label>Exit price (₹)</label><input id="f1" type="number" step="0.05" value="${e.exit??""}">
     <label>Exit date</label><input id="f2" type="date" value="${e.exitDate||today()}">
     <label>Mindset during the trade</label><select id="f3">${MIND.map(m=>`<option${m===e.mindset?" selected":""}>${m}</option>`).join("")}</select>
     <label>Reason for exit</label><textarea id="f4" rows="3" placeholder="Target hit, stop hit, rule-based exit, fear…">${esc(e.exitReason)}</textarea>`,
    ()=>{if(!(+val("f1")>0&&val("f2")&&val("f4").trim()))return bad("Fill exit price, date and reason");
      Object.assign(e,{exit:+val("f1"),exitDate:val("f2"),mindset:val("f3"),exitReason:val("f4").trim(),u:Date.now()});persist();renderJ()});
}
function del(i){if(confirm("Delete this journal entry?")){JL[i].deleted=true;JL[i].u=Date.now();persist();renderJ();render()}}

function chart(cl,pl){
  const a=[...cl].sort((x,y)=>(x.exitDate||"").localeCompare(y.exitDate||""));
  let c=0;const v=[0,...a.map(e=>c+=pl(e))];
  const W=320,H=130,P=8,mn=Math.min(0,...v),mx=Math.max(0,...v),r=(mx-mn)||1;
  const X=i=>(P+i*(W-2*P)/(v.length-1)).toFixed(1),Y=y=>(H-P-(y-mn)/r*(H-2*P)).toFixed(1);
  const col=c>=0?"var(--up)":"var(--dn)";
  return `<div class="card"><h2>Cumulative P&amp;L</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative profit and loss over closed trades"><line x1="${P}" x2="${W-P}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)" stroke-dasharray="4 3"/><polyline points="${v.map((y,i)=>X(i)+","+Y(y)).join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${v.map((y,i)=>i?`<circle cx="${X(i)}" cy="${Y(y)}" r="3" fill="${col}"/>`:"").join("")}</svg><div class="row px"><span>${a[0].exitDate}</span><b class="${cls(c)}">${rs(c)}</b><span>${a[a.length-1].exitDate}</span></div></div>`}
function renderJ(){
  const L=J.filter(e=>!e.deleted);
  const pl=e=>(e.exit-e.entry)*e.qty;
  const cl=L.filter(e=>e.status==="taken"&&e.exit!=null);
  const net=cl.reduce((s,e)=>s+pl(e),0),cap=cl.reduce((s,e)=>s+e.entry*e.qty,0);
  const wins=cl.filter(e=>pl(e)>0).length,R=cl.filter(e=>e.risk>0).map(e=>pl(e)/e.risk);
  const avgR=R.length?R.reduce((a,b)=>a+b,0)/R.length:0;
  let h=`<div class="card"><h2>Performance</h2><div class="grid">
    <div>Net P&amp;L<b class="${cls(net)}">${rs(net)}</b></div>
    <div>Return on capital<b class="${cls(net)}">${cap?(net/cap*100).toFixed(2):"0.00"}%</b></div>
    <div>Win rate<b>${cl.length?Math.round(wins/cl.length*100):0}% (${wins}/${cl.length})</b></div>
    <div>Avg R-multiple<b class="${cls(avgR)}">${avgR.toFixed(2)}R</b></div>
    <div>Open trades<b>${L.filter(e=>e.status==="taken"&&e.exit==null).length}</b></div>
    <div>Skipped<b>${L.filter(e=>e.status==="skipped").length}</b></div></div>`;
  const by={};cl.forEach(e=>{(by[e.mindset]=by[e.mindset]||[]).push(e)});
  const rows=Object.entries(by).map(([m,a])=>{const p=a.reduce((s,e)=>s+pl(e),0);return `<tr><td>${esc(m)}</td><td>${a.length}</td><td>${Math.round(a.filter(e=>pl(e)>0).length/a.length*100)}%</td><td class="${cls(p)}">${rs(p)}</td></tr>`}).join("");
  h+=rows?`<h3>Result by mindset</h3><table><tr><th>Mindset</th><th>Trades</th><th>Win</th><th>P&amp;L</th></tr>${rows}</table>`:`<div class="note">Close a trade to see results by mindset.</div>`;
  h+="</div>";
  if(cl.length)h+=chart(cl,pl);
  JL=[...L].sort((a,b)=>(b.entryDate||"").localeCompare(a.entryDate||""));
  h+=JL.length?JL.map((e,i)=>{
    if(e.status==="skipped")return `<div class="card"><div class="row"><b>${esc(e.symbol)}</b><span class="px">Not taken · ${e.entryDate}</span></div><div class="note">${esc(e.reason)}</div><div class="btns"><button onclick="del(${i})">Delete</button></div></div>`;
    const done=e.exit!=null,p=done?pl(e):0;
    return `<div class="card"><div class="row"><b>${esc(e.symbol)}</b><span class="px">${done?"Closed":"Open"} · ${e.entryDate}</span></div>
      <div class="qty">Entry ${fmt(e.entry)} × ${e.qty} · Stop ${fmt(e.stop)} · Risk <b>${rs(e.risk)}</b></div>
      ${done?`<div class="qty">Exit ${fmt(e.exit)} on ${e.exitDate}<br>P&amp;L <b class="${cls(p)}">${rs(p)}</b> (${((e.exit/e.entry-1)*100).toFixed(2)}%) · ${(e.risk>0?p/e.risk:0).toFixed(2)}R<br>Mindset: ${esc(e.mindset)}<div class="note">${esc(e.exitReason)}</div></div>`:""}
      <div class="btns"><button class="pri" onclick="closeT(${i})">${done?"Edit exit":"Add exit"}</button><button onclick="del(${i})">Delete</button></div></div>`}).join("")
    :`<div class="empty">No journal entries yet. Mark a scanned stock as taken or not taken.</div>`;
  h+=`<div class="card"><h2>Sync &amp; backup</h2><div class="note" id="ss">${SS}</div>
    <div class="btns"><button onclick="syncSetup()">Sync setup</button><button onclick="sync()">Sync now</button></div>
    <div class="note">Backup file (works without sync):</div>
    <div class="btns"><button onclick="exp()">Export</button><button onclick="$('imp').click()">Import</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div>`;
  $("v2").innerHTML=h;
}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(J,null,1)],{type:"application/json"}));a.download="gfs-journal-"+today()+".json";a.click()}
function imp(f){if(!f||!confirm("Replace the current journal with this file?"))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;J=d.map(e=>({...e,u:Date.now()}));persist();renderJ();render()}catch(e){alert("Not a valid journal file")}};r.readAsText(f)}

$("risk").value=RISK;
$("risk").onchange=()=>{RISK=Math.max(1,+$("risk").value||500);$("risk").value=RISK;sv(LR,RISK);render()};
$("rf").onclick=()=>{load();sync()};$("q").oninput=render;$("sort").onchange=render;
load();sync();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
</script>
</body>
</html>
